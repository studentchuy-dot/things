<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Margarita en la colina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#3f8fd6;
    --sky-mid:#7cc3ef;
    --sky-bottom:#dff2fb;
    --hill-light:#8fc25c;
    --hill-dark:#4f8f3a;
    --petal-light:#ffe873;
    --petal-dark:#ffc93c;
    --center-light:#c98a2e;
    --center-dark:#7a4a1a;
    --stem:#3f7d3a;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    font-family:'Segoe UI', system-ui, sans-serif;
  }

  #scene{
    position:relative;
    width:100vw; height:100vh;
    background: linear-gradient(to bottom,
      var(--sky-top) 0%,
      var(--sky-mid) 55%,
      var(--sky-bottom) 100%);
    overflow:hidden;
  }

  /* --- sol suave --- */
  #sun{
    position:absolute;
    top:8%; right:12%;
    width:110px; height:110px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,250,220,0.95) 0%, rgba(255,250,220,0.35) 45%, rgba(255,250,220,0) 70%);
    filter:blur(1px);
    pointer-events:none;
  }

  /* --- nubes --- */
  #clouds{ position:absolute; inset:0; pointer-events:none; }
  .cloud{
    position:absolute;
    left:-260px;
    animation-name:drift;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
    filter: drop-shadow(0 6px 4px rgba(60,90,120,0.08));
  }
  .cloud svg{ width:100%; height:100%; display:block; overflow:visible; }
  @keyframes drift{
    from{ transform:translateX(0); }
    to{ transform:translateX(calc(100vw + 340px)); }
  }

  /* --- colina --- */
  .hill{
    position:absolute;
    left:50%;
    border-radius:50%;
    transform:translateX(-50%);
  }
  #hill-back{
    bottom:-27.5vh; width:170vw; height:40vh;
    background: linear-gradient(to bottom, #a9d476, var(--hill-dark));
    opacity:0.85;
  }
  #hill-front{
    bottom:-26.4vh; width:150vw; height:36vh;
    background: linear-gradient(to bottom, var(--hill-light), var(--hill-dark));
  }

  /* --- flor --- */
  #flower-wrap{
    position:absolute;
    bottom:10.8vh;
    left:50%;
    width:clamp(150px, 26vw, 260px);
    transform-origin:bottom center;
    transform:translateX(-50%);
    animation:sway 4.5s ease-in-out infinite;
    filter: drop-shadow(0 8px 10px rgba(30,60,20,0.15));
  }
  @keyframes sway{
    0%, 100%{ transform:translateX(-50%) rotate(-2deg); }
    50%{ transform:translateX(-50%) rotate(2deg); }
  }
  #flower-svg{ width:100%; height:auto; display:block; overflow:visible; }
  #petals{
    transform-box: view-box;
    transform-origin: 150px 92px;
    animation: breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe{
    0%, 100%{ transform:scale(1); }
    50%{ transform:scale(1.02); }
  }

  /* --- dedicatoria --- */
  #title{
    position:absolute;
    top:5%;
    left:50%;
    transform:translateX(-50%);
    font-family:'Parisienne', 'Segoe Script', 'Brush Script MT', cursive;
    font-size:clamp(30px, 6.5vw, 54px);
    color:rgba(255,255,255,0.95);
    text-shadow: 0 2px 14px rgba(60,110,170,0.4), 0 1px 0 rgba(255,255,255,0.35);
    letter-spacing:1px;
    pointer-events:none;
    user-select:none;
    text-align:center;
  }
</style>
</head>
<body>

<div id="scene">

  <div id="sun"></div>
  <div id="clouds"></div>

  <div class="hill" id="hill-back"></div>
  <div class="hill" id="hill-front"></div>

  <div id="flower-wrap">
    <svg id="flower-svg" viewBox="0 0 300 430" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="petalGradient" cx="35%" cy="25%" r="80%">
          <stop offset="0%" stop-color="var(--petal-light)"/>
          <stop offset="100%" stop-color="var(--petal-dark)"/>
        </radialGradient>
        <radialGradient id="centerGradient" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="var(--center-light)"/>
          <stop offset="100%" stop-color="var(--center-dark)"/>
        </radialGradient>
      </defs>

      <!-- tallo -->
      <path d="M150,424 C150,360 138,300 150,150" fill="none" stroke="var(--stem)" stroke-width="10" stroke-linecap="round"/>

      <!-- hojas -->
      <path d="M150,300 C110,290 85,310 75,345 C115,345 140,325 150,300 Z" fill="var(--stem)"/>
      <path d="M150,230 C192,222 218,240 228,272 C190,275 163,255 150,230 Z" fill="var(--stem)"/>

      <!-- cabeza de la flor -->
      <g id="petals"><!-- pétalos generados por JS --></g>
      <g id="center">
        <circle cx="150" cy="92" r="44" fill="url(#centerGradient)"/>
        <g id="center-texture"></g>
      </g>
    </svg>
  </div>

  <div id="title">Para Alan</div>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <symbol id="cloud-shape" viewBox="0 0 200 120">
        <ellipse cx="100" cy="78" rx="92" ry="30" fill="#eef7ff"/>
        <circle cx="52" cy="58" r="30" fill="#ffffff"/>
        <circle cx="98" cy="42" r="38" fill="#ffffff"/>
        <circle cx="146" cy="58" r="29" fill="#ffffff"/>
        <circle cx="172" cy="74" r="21" fill="#ffffff"/>
      </symbol>
    </defs>
  </svg>

</div>

<script>
  // ======= CONFIGURACIÓN =======
  // Cambia estos valores para ajustar la flor.
  const CONFIG = {
    petalCount: 18,     // número de pétalos
    petalLength: 66,    // largo del pétalo
    petalWidth: 15,     // ancho del pétalo
    headRadius: 44,      // radio del centro de la flor
    cloudCount: 6        // número de nubes
  };
  // ==============================

  const HEAD_X = 150, HEAD_Y = 92;

  function buildPetals(n){
    const group = document.getElementById('petals');
    group.innerHTML = '';
    for(let i = 0; i < n; i++){
      const angle = (360 / n) * i;
      const petal = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
      petal.setAttribute('cx', HEAD_X);
      petal.setAttribute('cy', HEAD_Y - CONFIG.headRadius - (CONFIG.petalLength / 2) + 10);
      petal.setAttribute('rx', CONFIG.petalWidth);
      petal.setAttribute('ry', CONFIG.petalLength / 2);
      petal.setAttribute('fill', 'url(#petalGradient)');
      petal.setAttribute('stroke', '#e2a521');
      petal.setAttribute('stroke-width', '1');
      petal.setAttribute('transform', `rotate(${angle} ${HEAD_X} ${HEAD_Y})`);
      group.appendChild(petal);
    }
  }

  function buildCenterTexture(){
    const group = document.getElementById('center-texture');
    group.innerHTML = '';
    const dots = 46;
    for(let i = 0; i < dots; i++){
      const r = Math.sqrt(Math.random()) * (CONFIG.headRadius - 8);
      const a = Math.random() * Math.PI * 2;
      const x = HEAD_X + Math.cos(a) * r;
      const y = HEAD_Y + Math.sin(a) * r;
      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('cx', x.toFixed(1));
      dot.setAttribute('cy', y.toFixed(1));
      dot.setAttribute('r', (1 + Math.random() * 1.6).toFixed(1));
      dot.setAttribute('fill', '#5a3311');
      dot.setAttribute('opacity', (0.25 + Math.random() * 0.35).toFixed(2));
      group.appendChild(dot);
    }
  }

  function buildClouds(){
    const layer = document.getElementById('clouds');
    layer.innerHTML = '';
    for(let i = 0; i < CONFIG.cloudCount; i++){
      const size = 90 + Math.random() * 130;
      const top = 4 + Math.random() * 38;
      const duration = 45 + Math.random() * 45;
      const delay = -Math.random() * duration;
      const div = document.createElement('div');
      div.className = 'cloud';
      div.style.width = size + 'px';
      div.style.height = (size * 0.5) + 'px';
      div.style.top = top + 'vh';
      div.style.opacity = (0.75 + Math.random() * 0.25).toFixed(2);
      div.style.animationDuration = duration + 's';
      div.style.animationDelay = delay + 's';
      div.innerHTML = '<svg viewBox="0 0 200 100"><use href="#cloud-shape"></use></svg>';
      layer.appendChild(div);
    }
  }

  buildPetals(CONFIG.petalCount);
  buildCenterTexture();
  buildClouds();
</script>

</body>
</html>
