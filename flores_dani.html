<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rosas para Daniel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#294e6d;
    --sky-mid:#7ba3c7;
    --sky-bottom:#f2e8d8;
    --hill-light:#6f9f5d;
    --hill-dark:#2d5a35;
    --rose-dark:#7e0718;
    --rose-mid:#c5152f;
    --rose-light:#ff2f4c;
    --rose-shadow:#52050d;
    --leaf-dark:#214f26;
    --leaf-light:#4d9b58;
    --petal-highlight:#ffd7df;
    --center-light:#f7d77a;
    --center-dark:#b98028;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    font-family:'Segoe UI', system-ui, sans-serif;
  }

  #scene{
    position:relative;
    width:100vw; height:100vh;
    background: linear-gradient(to bottom,
      var(--sky-top) 0%,
      #6a8fb3 24%,
      var(--sky-mid) 52%,
      #dfe9e0 78%,
      var(--sky-bottom) 100%);
    overflow:hidden;
  }

  #sun{
    position:absolute;
    top:8%; right:12%;
    width:110px; height:110px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,245,220,0.9) 0%, rgba(255,225,180,0.38) 45%, rgba(255,225,180,0) 70%);
    filter:blur(1px);
    pointer-events:none;
  }

  #clouds{ position:absolute; inset:0; pointer-events:none; }
  .cloud{
    position:absolute;
    left:-260px;
    animation-name:drift;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
    filter: drop-shadow(0 6px 4px rgba(60,90,120,0.08));
    opacity:0.8;
  }
  .cloud svg{ width:100%; height:100%; display:block; overflow:visible; }
  @keyframes drift{
    from{ transform:translateX(0); }
    to{ transform:translateX(calc(100vw + 340px)); }
  }

  .hill{
    position:absolute;
    left:50%;
    border-radius:50%;
    transform:translateX(-50%);
  }
  #hill-back{
    bottom:-27.5vh; width:170vw; height:40vh;
    background: linear-gradient(to bottom, #a9d476, var(--hill-dark));
    opacity:0.85;
  }
  #hill-front{
    bottom:-26.4vh; width:150vw; height:36vh;
    background: linear-gradient(to bottom, var(--hill-light), var(--hill-dark));
  }

  .rose-garden{
    position:absolute;
    inset:0;
    pointer-events:none;
  }

  .rose {
    --offset-x: 0px;
    --scale: 1;
    position:absolute;
    left:calc(50% + var(--offset-x));
    bottom:2vh;
    width:clamp(80px, 12vw, 150px);
    transform-origin:center bottom;
    animation:roseFloat 5.5s ease-in-out infinite;
    filter: drop-shadow(0 8px 10px rgba(82, 12, 28, 0.18));
    opacity: 0.98;
  }

  .rose:nth-child(1){ --offset-x:-38vw; --scale:0.82; bottom:4vh; animation-delay:-0.4s; z-index:1; }
  .rose:nth-child(2){ --offset-x:-23vw; --scale:0.98; bottom:3vh; animation-delay:-1.2s; z-index:2; }
  .rose:nth-child(3){ --offset-x:-9vw; --scale:1.1; bottom:4.5vh; z-index:3; }
  .rose:nth-child(4){ --offset-x:7vw; --scale:1.18; bottom:5vh; animation-delay:-0.8s; z-index:4; }
  .rose:nth-child(5){ --offset-x:22vw; --scale:1.05; bottom:3vh; animation-delay:-1.7s; z-index:3; }
  .rose:nth-child(6){ --offset-x:-46vw; --scale:0.72; bottom:1.4vh; animation-delay:-2.4s; z-index:1; }
  .rose:nth-child(7){ --offset-x:43vw; --scale:0.75; bottom:1.8vh; animation-delay:-2.9s; z-index:1; }

  @keyframes roseFloat{
    0%, 100%{ transform:translateX(-50%) rotate(-3deg) translateY(0) scale(var(--scale)); }
    50%{ transform:translateX(-50%) rotate(3deg) translateY(-8px) scale(var(--scale)); }
  }

  .rose svg{
    width:100%;
    height:auto;
    display:block;
    overflow:visible;
    transform:translateY(-4px);
  }

  @media (max-width: 768px) {
    .rose {
      width: clamp(180px, 35vw, 260px);
      bottom: 1vh;
    }

    .rose:nth-child(1){ --offset-x:-34vw; --scale:0.9; bottom:1.5vh; }
    .rose:nth-child(2){ --offset-x:-20vw; --scale:1.02; bottom:1.2vh; }
    .rose:nth-child(3){ --offset-x:-7vw; --scale:1.18; bottom:2vh; }
    .rose:nth-child(4){ --offset-x:8vw; --scale:1.26; bottom:2.2vh; }
    .rose:nth-child(5){ --offset-x:21vw; --scale:1.12; bottom:1.4vh; }
    .rose:nth-child(6){ --offset-x:-47vw; --scale:0.82; bottom:0.5vh; }
    .rose:nth-child(7){ --offset-x:45vw; --scale:0.82; bottom:0.7vh; }

    .rose svg {
      transform: translateY(-18px) scale(1.12);
    }
  }

  #title{
    position:absolute;
    top:5%;
    left:50%;
    transform:translateX(-50%);
    font-family:'Parisienne', 'Segoe Script', 'Brush Script MT', cursive;
    font-size:clamp(30px, 6.5vw, 54px);
    color:rgba(255,255,255,0.95);
    text-shadow: 0 2px 14px rgba(80,20,30,0.38), 0 1px 0 rgba(255,255,255,0.32);
    letter-spacing:1px;
    pointer-events:none;
    user-select:none;
    text-align:center;
  }
</style>
</head>

        <circle cx="98" cy="42" r="38" fill="#ffffff"/>

</div>

<script>
  const CONFIG = {
    cloudCount: 6
  };

  function buildClouds(){
    const layer = document.getElementById('clouds');
    layer.innerHTML = '';
    for(let i = 0; i < CONFIG.cloudCount; i++){
      const size = 90 + Math.random() * 130;
      const top = 4 + Math.random() * 38;
      const duration = 45 + Math.random() * 45;
      const delay = -Math.random() * duration;
      const div = document.createElement('div');
      div.className = 'cloud';
      div.style.width = size + 'px';
      div.style.height = (size * 0.5) + 'px';
      div.style.top = top + 'vh';
      div.style.opacity = (0.75 + Math.random() * 0.25).toFixed(2);
      div.style.animationDuration = duration + 's';
      div.style.animationDelay = delay + 's';
      div.innerHTML = '<svg viewBox="0 0 200 100"><use href="#cloud-shape"></use></svg>';
      layer.appendChild(div);
    }
  }

  buildClouds();
</script>
